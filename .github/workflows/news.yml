name: Refresh news

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, at 17 minutes past
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new articles
        run: python3 scripts/fetch_news.py --days 3
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "News: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
          # pushes made with GITHUB_TOKEN don't always trigger a Pages build, so ask for one
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
